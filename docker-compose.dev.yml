services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockmatrix_backend_dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_data_dev:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/stock_dashboard.db
      - SECRET_KEY=supersecretjwtkey_stock_dashboard_development
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: stockmatrix_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data_dev:
    driver: local
